<!DOCTYPE html>
<html lang="en">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
   <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScanPay</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 25px;
  background: #0b1110;
  color: white;
  font-family: Arial, sans-serif;
}
main { max-width: 500px; margin: 35px auto; }
h1 { color: #54e6b0; font-size: 36px; }
p { color: #aab8b2; }
input, button {
  width: 100%;
  padding: 15px;
  margin: 9px 0;
  border-radius: 9px;
  font-size: 16px;
}
input {
  background: #18221f;
  border: 1px solid #35443e;
  color: white;
}
button {
  background: #54e6b0;
  color: #07110e;
  border: 0;
  font-weight: bold;
}
#invoice {
  display: none;
  margin-top: 25px;
  padding: 20px;
  background: #18221f;
  border-radius: 12px;
}
</style>
</head>
<body>
<main>
<h1>ScanPay</h1>
<p>Payments made simple.</p>
<h2>Create an invoice</h2>

<input id="customer" placeholder="Customer name">
<input id="item" placeholder="What are they paying for?">
<input id="amount" type="number" min="0" step="0.01" placeholder="Amount">

<button onclick="createInvoice()">Create invoice</button>

<div id="invoice">
<div id="qrcode"></div>
<p>Scan to view invoice</p>
  <h2>Invoice created!</h2>

<p id="details"></p>
<button onclick="window.print()">Print invoice</button>
</div>
</main>

<script>
function createInvoice() {
  const customer = document.getElementById("customer").value.trim();
  const item = document.getElementById("item").value.trim();
  const amount = Number(document.getElementById("amount").value);

  if (!customer || !item || !Number.isFinite(amount) || amount <= 0) {
    alert("Please complete all fields with a valid amount.");
    return;
  }

  document.getElementById("details").innerHTML =
    "Customer: " + customer.replace(/[&<>"]/g, "") +
    "<br>Item: " + item.replace(/[&<>"]/g, "") +
    "<br>Amount: " + amount.toFixed(2);
const qr = document.getElementById("qrcode");
qr.innerHTML = "";
new QRCode(qr, {
text: window.location.origin + window.location.pathname +
"?customer=" + encodeURIComponent(customer) +
"&item=" + encodeURIComponent(item) +
"&amount=" + encodeURIComponent(amount.toFixed(2)),
Customer: ${customer}
Item: ${item}
Amount: ${amount.toFixed(2)}`,
  width: 180,
  height: 180
});
  document.getElementById("invoice").style.display = "block";
}
const params = new URLSearchParams(window.location.search);
const customerFromUrl = params.get("customer");
const itemFromUrl = params.get("item");
const amountFromUrl = params.get("amount");

if (customerFromUrl && itemFromUrl && amountFromUrl) {
  document.getElementById("details").textContent =
    "Customer: " + customerFromUrl +
    "\nItem: " + itemFromUrl +
    "\nAmount: " + amountFromUrl;

  document.getElementById("details").style.whiteSpace = "pre-line";
  document.getElementById("invoice").style.display = "block";

  document.querySelectorAll("input").forEach(input => {
    input.style.display = "none";
  });

  document.querySelector("main > button").style.display = "none";
}
</script>
</body>
</html>
